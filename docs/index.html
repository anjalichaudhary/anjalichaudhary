<title id="title">anjali --rewind: my career, backtracked from now to where I started in 2017</title>
<desc id="desc">$ anjali --rewind
◀◀ 2026–now · the agentic mentor · principal software engineer @ Great Learning
   Building an agentic mentor with two sides: an academic
   side for doubts, a program-office side for deadlines
   and admin. One mentor, two hats.
   [agentic AI] [academic] [program office]
◀◀ 2024–now · the AI teacher · lead → principal software engineer @ Great Learning
   The AI teacher, built across my lead and principal years.
   Its board work is better than mine ever was.
   [AI teacher] [lead → principal]
◀◀ 2024–26 · the course-aware mentor · lead software engineer @ Great Learning
   Spearheaded course-level, context-aware AI mentors that
   read the course, video subtitles and assignment metadata.
   Negative learner feedback: −36% across 100K+ interactions.
   [AI mentors] [context-aware] [personalized learning]
◀◀ 2024–26 · the prompt exam hall · lead software engineer @ Great Learning
   Built a prompt evaluation system, so prompts get tested
   safely and iteratively, like code. And a video pipeline:
   subtitles → structured JSON summaries, via Elasticsearch.
   [prompt evaluation system] [video summarization] [Elasticsearch]
◀◀ 2021–24 · coding labs in the cloud · senior software development engineer @ Great Learning
   Put coding labs in the cloud: Jupyter and PySpark on
   AWS ECS, Fargate and EFS, for 5K+ learners at once.
   Boot time −40%. The labs even clean up after themselves.
   [5K+ concurrent] [90%+ 3rd-party assessment tools replaced]
◀◀ 2021–24 · the MCQ-o-matic · senior software development engineer @ Great Learning
   Built an AI MCQ generator: 4.6K+ questions, over half
   accepted, and mentors serving 200+ cohorts. Plus live AI
   code feedback in Python, JavaScript, SQL and Java.
   [assignment + content mentors] [assessment pipelines modernized]
◀◀ 2020–21 · the LMS speed run · software development engineer @ Great Learning
   Got the LMS loading in 1.89s instead of 3.1s: JS and
   CSS now arrive only when they are actually needed.
   Also: video quizzes and a secure code runner.
   [auth + API security] [DB caching] [auto-scaling code execution]
◀◀ 2019–20 · the great migration · software development engineer @ Applied AI Course
   Core backend dev, requirements to deploy: Django REST,
   Postgres, Nginx, AWS Fargate. Migrated data for 1000s of
   users from Google Classroom. Evaluation response: −75%.
   [Docker] [RDS + load balancer]
◀◀ 2018–19 · vehicles, tolls &#38; texts · software development engineer @ Goomo
   Full-stack Java + Angular, B2B vehicle marketplace. Popular
   trip prices pre-computed in Redis: APIs ~50% faster. Toll
   data automated. SMS + email between vendor, driver, buyer.
   [Java] [Angular] [Redis]
◀◀ 2017 · bug hunt, level 1 · software engineer intern @ Goomo
   Rails intern. Built a flights dashboard, back and front,
   and an API debugging tool that streamlined API debugging.
   Level 1: cleared.
   [Ruby on Rails] [flights dashboard] [API debugger]
▶▶ fast-forwarding back to now…
▶  now · thanks for watching · rewind complete
   7 roles · 3 companies · 2017 → now, all on one tape.
   Be kind, rewind. Or say hi on LinkedIn.
   [linkedin.com/in/anjali-chaudhary]</desc>

<script>
const D = 92650, FF = [81850, 84050], FF_TEXT = "▶▶ fast-forwarding back to now…", CH = [{"at":1850,"end":9850,"title":"2026–now · the agentic mentor"},{"at":9850,"end":17850,"title":"2024–now · the AI teacher"},{"at":17850,"end":25850,"title":"2024–26 · the course-aware mentor"},{"at":25850,"end":33850,"title":"2024–26 · the prompt exam hall"},{"at":33850,"end":41850,"title":"2021–24 · coding labs in the cloud"},{"at":41850,"end":49850,"title":"2021–24 · the MCQ-o-matic"},{"at":49850,"end":57850,"title":"2020–21 · the LMS speed run"},{"at":57850,"end":65850,"title":"2019–20 · the great migration"},{"at":65850,"end":73850,"title":"2018–19 · vehicles, tolls & texts"},{"at":73850,"end":81850,"title":"2017 · bug hunt, level 1"},{"at":84050,"end":92050,"title":"rewind complete"}];
const svg = document.querySelector('#tape svg'), playBtn = document.getElementById('play');
const scrub = document.getElementById('scrub'), clock = document.getElementById('clock'), now = document.getElementById('now');
const chips = [...document.querySelectorAll('[data-ch]')];
let anims = [], tape = [], playing = true;
const t = () => (tape[0] ? tape[0].currentTime % D : 0);
const fmt = (ms) => { const s = Math.floor(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const chapterAt = (ms) => CH.reduce((c, ch, i) => (ms >= ch.at - 1 ? i : c), 0);
function seek(ms) {
  ms = ((ms % D) + D) % D;
  for (const a of tape) a.currentTime = ms;
  render();
}
function setPlaying(on) {
  playing = on;
  for (const a of anims) on ? a.play() : a.pause();
  playBtn.textContent = on ? '❚❚' : '▶';
  playBtn.setAttribute('aria-label', on ? 'Pause' : 'Play');
  // Announce scene changes only when paused, not every few seconds during playback.
  now.setAttribute('aria-live', on ? 'off' : 'polite');
  if (on) requestAnimationFrame(loop);
}
// Playing: land at the start of the scene to watch it unfold. Paused: land where it is complete.
function jump(i) {
  const c = CH[(i + CH.length) % CH.length];
  seek(playing ? c.at + 400 : c.end - 700);
}
function render() {
  const ms = t(), i = chapterAt(ms);
  const title = ms >= FF[0] && ms < FF[1] ? FF_TEXT : CH[i].title;
  scrub.value = ms; clock.textContent = fmt(ms) + ' / ' + fmt(D);
  scrub.setAttribute('aria-valuetext', fmt(ms) + ', ' + title);
  if (now.textContent !== title) now.textContent = title;
  if (now.dataset.i !== String(i)) {
    now.dataset.i = i;
    chips.forEach((c, j) => c.setAttribute('aria-current', j === i ? 'true' : 'false'));
  }
}
function loop() { render(); if (playing) requestAnimationFrame(loop); }
// Playing and 2s into a scene: restart it. Otherwise (or paused, where jumps land at the end): go back one.
document.getElementById('prev').onclick = () => { const i = chapterAt(t()); jump(playing && t() - CH[i].at > 2000 ? i : i - 1); };
document.getElementById('next').onclick = () => jump(chapterAt(t()) + 1);
document.getElementById('back').onclick = () => seek(t() - 5000);
document.getElementById('fwd').onclick = () => seek(t() + 5000);
playBtn.onclick = () => setPlaying(!playing);
scrub.oninput = () => seek(Number(scrub.value));
chips.forEach((c) => (c.onclick = () => jump(Number(c.dataset.ch))));
document.addEventListener('keydown', (e) => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  const el = e.target instanceof Element ? e.target : null;
  const k = e.key.toLowerCase();
  if (el && el.closest('input')) return;
  if (k === ' ' && el && el.closest('button')) return;
  if (k === ' ' || k === 'k') { e.preventDefault(); setPlaying(!playing); }
  else if (k === 'arrowleft') document.getElementById('prev').click();
  else if (k === 'arrowright') document.getElementById('next').click();
  else if (k === 'j') seek(t() - 5000);
  else if (k === 'l') seek(t() + 5000);
});
// Take control: lift the tape's reduced-motion freeze, then respect the preference here instead.
document.documentElement.classList.add('js-player');
anims = svg.getAnimations({ subtree: true });
tape = anims.filter((a) => Math.abs(a.effect.getTiming().duration - D) < 1);
if (matchMedia('(prefers-reduced-motion: reduce)').matches) { setPlaying(false); jump(0); }
render();
if (playing) requestAnimationFrame(loop);
</script>
